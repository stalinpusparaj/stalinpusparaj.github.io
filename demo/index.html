<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=320,height=480">
  <meta name="ad.orientation" content="portrait,landscape">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light Up the Skies: Demo</title>
  <link rel="icon" type="image/png" href="../site/icon.png">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #07061c;
      color: #f6e7c1;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }
    #top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px 16px 0 16px;
      text-align: center;
      pointer-events: none;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: normal;
      letter-spacing: 0.04em;
      line-height: 1.15;
    }
    #hint {
      margin: 6px 0 0 0;
      font-family: "Gill Sans", "Trebuchet MS", sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d9c89a;
    }
    #install {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      height: 48px;
      border: 0;
      border-radius: 999px;
      background: #f0b429;
      color: #1a1204;
      font-family: "Gill Sans", "Trebuchet MS", sans-serif;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.02em;
    }
    #card {
      display: none;
      position: absolute;
      left: 20px;
      right: 20px;
      top: 22%;
      padding: 18px 16px 16px 16px;
      text-align: center;
      background: #120e28;
      border: 1px solid #3a315c;
    }
    #card.show {
      display: block;
    }
    #card p {
      margin: 8px 0 0 0;
      font-family: "Gill Sans", "Trebuchet MS", sans-serif;
      font-size: 14px;
      line-height: 1.4;
      color: #efe6cf;
    }
    #again {
      margin-top: 12px;
      background: transparent;
      border: 0;
      color: #d9c89a;
      font-family: "Gill Sans", "Trebuchet MS", sans-serif;
      font-size: 13px;
    }
    @media (orientation: landscape) {
      h1 { font-size: 20px; }
      #top { text-align: left; padding-top: 14px; }
      #install { left: auto; width: 200px; right: 16px; bottom: 14px; }
      #card { top: 16px; left: auto; width: 240px; right: 16px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="sky"></canvas>
    <div id="top">
      <h1>Light Up the Skies</h1>
      <p id="hint">Tap the sky</p>
    </div>
    <div id="card">
      <h1>Their name. In the sky.</h1>
      <p>24 Diwali crackers over the Taj Mahal. Free, with no smoke.</p>
      <button id="again" type="button">Light another</button>
    </div>
    <button id="install" type="button">Install free</button>
  </div>
  <script>
    (function () {
      var canvas = document.getElementById("sky");
      var hint = document.getElementById("hint");
      var card = document.getElementById("card");
      var ctx = canvas.getContext("2d");
      var bursts = [];
      var rockets = [];
      var stars = [];
      var launches = 0;
      var width = 0;
      var height = 0;
      var dpr = 1;
      var hints = ["Tap the sky", "Again", "One more"];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!stars.length) {
          var count = Math.round((width * height) / 2800);
          for (var i = 0; i < count; i++) {
            stars.push({
              x: Math.random(),
              y: Math.random() * 0.72,
              r: Math.random() * 1.3 + 0.3,
              a: Math.random() * 0.7 + 0.2
            });
          }
        }
      }

      var photo = new Image();
      photo.src = "taj.jpg";

      function drawTaj() {
        var band = Math.min(height * 0.42, width * 0.92);
        var y = height - band - 76;
        if (photo.complete && photo.naturalWidth) {
          ctx.drawImage(photo, (width - band) / 2, y, band, band);
          var fade = ctx.createLinearGradient(0, y, 0, y + band * 0.22);
          fade.addColorStop(0, "#07061c");
          fade.addColorStop(1, "rgba(7,6,28,0)");
          ctx.fillStyle = fade;
          ctx.fillRect((width - band) / 2, y, band, band * 0.22);
        }
      }

      function spawn(x, y) {
        var palette = ["#ffb703", "#ff5d73", "#7ad7ff", "#c6f5d4", "#fff6d8"];
        var color = palette[launches % palette.length];
        var parts = [];
        var n = 64;
        var i;
        for (i = 0; i < n; i++) {
          var angle = (Math.PI * 2 * i) / n;
          var speed = 2.4 + (i % 6) * 0.85;
          parts.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: i % 4 === 0 ? "#fff6d8" : color
          });
        }
        bursts.push(parts);
        rockets.push({ x: x, y: height * 0.62, tx: x, ty: y, t: 0 });
      }

      function frame() {
        ctx.fillStyle = "#07061c";
        ctx.fillRect(0, 0, width, height);
        var g = ctx.createLinearGradient(0, 0, 0, height);
        g.addColorStop(0, "#141033");
        g.addColorStop(1, "#07061c");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, width, height);

        var s;
        for (s = 0; s < stars.length; s++) {
          ctx.globalAlpha = stars[s].a;
          ctx.fillStyle = "#fff8e8";
          ctx.beginPath();
          ctx.arc(stars[s].x * width, stars[s].y * height, stars[s].r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        drawTaj();

        var r;
        for (r = rockets.length - 1; r >= 0; r--) {
          rockets[r].t += 0.08;
          if (rockets[r].t >= 1) {
            rockets.splice(r, 1);
            continue;
          }
          var ry = rockets[r].y + (rockets[r].ty - rockets[r].y) * rockets[r].t;
          ctx.fillStyle = "#ffe8a3";
          ctx.fillRect(rockets[r].x - 1.5, ry, 3, 16);
        }

        var b;
        for (b = bursts.length - 1; b >= 0; b--) {
          var parts = bursts[b];
          var alive = false;
          var p;
          for (p = 0; p < parts.length; p++) {
            var dot = parts[p];
            if (dot.life <= 0) continue;
            alive = true;
            dot.x += dot.vx;
            dot.y += dot.vy;
            dot.vy += 0.018;
            dot.life -= 0.006;
            ctx.globalAlpha = Math.max(dot.life, 0);
            ctx.fillStyle = dot.color;
            ctx.beginPath();
            ctx.arc(dot.x, dot.y, 3.4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          if (!alive) bursts.splice(b, 1);
        }
        requestAnimationFrame(frame);
      }

      function launchAt(x, y) {
        if (y > height * 0.58) y = height * 0.34;
        spawn(x, y);
        launches += 1;
        if (launches <= hints.length) hint.textContent = hints[launches - 1];
        if (launches === 3) card.className = "show";
      }

      canvas.addEventListener("pointerdown", function (event) {
        if (card.className === "show") return;
        launchAt(event.clientX, event.clientY);
      });

      document.getElementById("again").addEventListener("click", function (event) {
        event.stopPropagation();
        card.className = "";
        hint.textContent = "Tap the sky";
      });

      document.getElementById("install").addEventListener("click", function (event) {
        event.stopPropagation();
        window.location.href = "https://play.google.com/store/apps/details?id=com.stalinpusparaj.lightuptheskies";
      });

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
